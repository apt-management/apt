<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="sub">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div id="container">
        <div class="sub-title">
            <p>회원가입</p>
        </div>
        <div class="wrap">
            <div class="form sign-up">
                <p class="title">회원정보 입력</p>
                <form method="POST" action="/signup">
                    <ul class="form-list">
                        <li>
                            <label for="number">전화번호</label>
                            <input type="text" id="number" name="number" placeholder="-를 제외하고 입력" autofocus required>
                        </li>
                        <li>
                            <label for="userid">아이디</label>
                            <input type="text" id="userid" name="userid" required>
                        </li>
                        <li>
                            <label for="password">비밀번호</label>
                            <input type="password" id="password" name="password" placeholder="영문, 숫자, 특수 문자 포함 8~12자" required>
                        </li>
                        <li>
                            <label for="name">이름</label>
                            <input type="text" id="name" name="name" required>
                        </li>
                        <li>
                            <label for="address">거주 구역</label>
                            <input type="text" id="address" name="address" placeholder="OO동" required>
                        </li>
                    </ul>
                    <div class="btn-box type-02">
                        <a href="/"><button type="button">취소</button></a>
                        <button type="submit">회원가입</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        var errorMessage = "[[${signupError}]]";
        if (errorMessage && errorMessage !== "null" && errorMessage !== "") {
            alert(errorMessage);
        }
    };
    $(document).ready(function () {
        $(".btn-box button:last").click(function (event) {
            event.preventDefault();

            let number = $("#number").val();
            let userid = $("#userid").val();
            let password = $("#password").val();
            let name = $("#name").val();
            let address = $("#address").val();

            if (!number) {
                alert("전화번호를 입력해주세요.");
                $("#number").focus();
                return;
            }

            if (!userid) {
                alert("아이디를 입력해주세요.");
                $("#userid").focus();
                return;
            }

            if (!password) {
                alert("비밀번호를 입력해주세요.");
                $("#password").focus();
                return;
            }

            if (!name) {
                alert("이름을 입력해주세요.");
                $("#name").focus();
                return;
            }

            if (!address) {
                alert("거주 구역을 입력해주세요.");
                $("#address").focus();
                return;
            }

            if (!validatePassword(password)) {
                alert("비밀번호는 영문, 숫자, 특수 문자를 포함하여 8~12자로 설정해야 합니다.");
                return;
            }

            $.ajax({
                type: "POST",
                url: "/signup",
                contentType: "application/json",
                data: JSON.stringify({
                    userid: userid,
                    number: number,
                    password: password,
                    name: name,
                    address: address
                }),
                success: function (response) {
                    alert("회원가입이 완료되었습니다!");
                    window.location.href = "/login";
                },
                error: function (xhr) {
                    let errorMessage = xhr.responseText || "회원가입 실패. 다시 시도해주세요.";
                    alert(errorMessage);
                }
            });
        });

        function validatePassword(password) {
            let regex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,12}$/;
            return regex.test(password);
        }
    });
</script>

</body>
</html>
