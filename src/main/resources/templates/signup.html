<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="sub">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div id="container">
        <div class="sub-title">
            <p>회원가입</p>
        </div>
        <div class="wrap">
            <div class="form sign-up">
                <p class="title">회원정보 입력</p>
                <form method="POST" action="/signup">
                    <ul class="form-list">
                        <li>
                            <label for="number">전화번호</label>
                            <input type="text" id="number" name="number" placeholder="-를 제외하고 입력" autofocus required>
                        </li>
                        <li>
                            <label for="userid">아이디</label>
                            <input type="text" id="userid" name="userid" required>
                        </li>
                        <li>
                            <label for="password">비밀번호</label>
                            <input type="password" id="password" name="password" placeholder="영문, 숫자, 특수 문자 포함 8~12자" required>
                        </li>
                        <li>
                            <label for="name">이름</label>
                            <input type="text" id="name" name="name" required>
                        </li>
                        <li>
                            <label for="address">거주 구역</label>
                            <input type="text" id="address" name="address" placeholder="OO동" required>
                        </li>
                    </ul>
                    <div class="btn-box type-02">
                        <a href="/"><button type="button">취소</button></a>
                        <button type="submit">회원가입</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        var errorMessage = "[[${signupError}]]";
        if (errorMessage && errorMessage !== "null" && errorMessage !== "") {
            alert(errorMessage);
        }
    };
</script>

</body>
</html>
