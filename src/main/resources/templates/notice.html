<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="sub">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div id="container">
        <div class="sub-title">
            <p>공지사항</p>
        </div>
        <div class="wrap">
            <div class="title-mini">
                <div>
                    <p class="title">공지사항</p>
                    <span class="mini-text">아파트 공지사항을 안내해드립니다.</span>
                    <span class="mini-text"></span>
                    <div class="table-wrap">
                        <table>
                            <colgroup>
                                <col style="width: 10%;">
                                <col>
                                <col style="width: 15%;">
                                <col style="width: 25%;">
                                <col style="width: 10%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>번호</th>
                                <th>제목</th>
                                <th>첨부파일</th>
                                <th>작성일</th>
                                <th>조회수</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="notice : ${notices}">
                                <td th:text="${notice.number}"></td>
                                <td>
                                    <a th:href="@{/notice/{id}(id=${notice.id})}" th:text="${notice.title}"></a>
                                </td>
                                <td>
                                    <img th:src="@{/images/icon-file.svg}" alt="파일" th:if="${notice.attachFile != null}" class="file">
                                </td>
                                <td th:text="${notice.createDate}"></td>
                                <td th:text="${notice.viewCount}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- 페이지네이션 부분 AJAX 로 갱신 기능 -->
                    <div class="pagination" id="pagination">
                        <a href="#none" class="page-move page-prev">이전 페이지</a>
                        <a href="#none" class="now">1</a>
                        <a href="#none">2</a>
                        <a href="#none">3</a>
                        <a href="#none">4</a>
                        <a href="#none">5</a>
                        <a href="#none" class="page-move page-next">다음 페이지</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function() {
        // 페이지네이션 링크 클릭 시
        $('.pagination a').on('click', function(e) {
            e.preventDefault();

            var page = $(this).text();  // 클릭된 페이지 번호
            if (page === '이전 페이지') {
                page = parseInt($('.pagination .now').text()) - 1;  // 이전 페이지
            } else if (page === '다음 페이지') {
                page = parseInt($('.pagination .now').text()) + 1;  // 다음 페이지
            }

            // Ajax로 공지사항을 비동기적으로 요청
            $.ajax({
                url: '/notices',
                data: { page: page },
                method: 'GET',
                success: function(response) {
                    // 공지사항 HTML 업데이트
                    $('.table-wrap tbody').html(response.noticesHtml);
                    // 페이지네이션 HTML 업데이트
                    $('.pagination').html(response.paginationHtml);
                },
                error: function() {
                    alert("공지사항을 불러오는 데 실패했습니다.");
                }
            });
        });
    });
</script>
</body>
</html>
