<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="sub">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div id="container">
        <div class="sub-title">
            <p>공지사항</p>
        </div>
        <div class="wrap">
            <div class="title-mini">
                <div>
                    <p class="title">공지사항</p>
                    <span class="mini-text">아파트 공지사항을 안내해드립니다.</span>
                    <span class="mini-text"></span>
                    <div class="table-wrap">
                        <table>
                            <colgroup>
                                <col style="width: 10%;">
                                <col>
                                <col style="width: 15%;">
                                <col style="width: 25%;">
                                <col style="width: 10%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>번호</th>
                                <th>제목</th>
                                <th>첨부파일</th>
                                <th>작성일</th>
                                <th>조회수</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="notice : ${notices}">
                                <td th:text="${notice.id}"></td>
                                <td>
                                    <a th:href="@{/notice/view/{id}(id=${notice.id})}" th:text="${notice.title}"></a>
                                </td>
                                <td>
                                    <img th:if="${notice.attach != null}" src="/images/icon-file.svg" alt="파일" class="file">
                                </td>
                                <td th:text="${notice.createDate}"></td>
                                <td th:text="${notice.viewer}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <th:block th:if="${totalPages == 0}">
                        <p class="no-notice">공지사항이 없습니다.</p>
                    </th:block>

                    <div class="pagination" th:if="${totalPages > 0}">
                        <a th:if="${currentPage > 1}" th:href="@{/notice(page=${currentPage - 1})}" class="page-move page-prev">이전 페이지</a>

                        <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                            <a th:href="@{/notice(page=${i})}" th:text="${i}" th:classappend="${i == currentPage} ? 'now' : ''"></a>
                        </th:block>

                        <a th:if="${currentPage < totalPages}" th:href="@{/notice(page=${currentPage + 1})}" class="page-move page-next">다음 페이지</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .pagination a {
        margin: 0 5px;
    }
    .no-notice {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        margin-top: 50px;
    }
</style>

</body>
</html>
