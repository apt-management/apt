<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 페이지</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>

<body>
<div id="main">

    <!-- Templates Engine Navbar 적용 -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div id="container">
        <div class="weather">
            <strong>우리 동네 기온과 습도는?</strong>
            <div>
                <div class="weather-wrap">
                    <div>
                        <img src="/images/icon-temperature.svg" alt="기온">
                        <p>기온</p>
                        <p>
                            <span id="temperature" th:text="${temperature}">-</span>
                        </p>
                    </div>
                </div>
                <div class="weather-wrap">
                    <div>
                        <img src="/images/icon-percent.svg" alt="습도">
                        <p>습도</p>
                        <p>
                            <span id="humidity" th:text="${humidity}">-</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="notice">
            <div class="notice-top">
                <strong>공지사항</strong>
                <a href="/notice">
                    <img src="/images/icon-more.svg" alt="더보기">
                </a>
            </div>

            <div class="notice-list">
                <ul>
                    <li><a href="#none">아파트 규칙에 대해 안내드립니다.</a></li>
                    <li><a href="#none">아파트 규칙에 대해 안내드립니다.</a></li>
                    <li><a href="#none">아파트 규칙에 대해 안내드립니다.</a></li>
                    <li><a href="#none">아파트 규칙에 대해 안내드립니다.</a></li>
                    <li><a href="#none">아파트 규칙에 대해 안내드립니다.</a></li>
                </ul>
            </div>
        </div>
    </div>

    <img src="/images/main-bg.png" alt="메인 배경" class="main-bg">
</div>

<script type="text/javascript">
    function updateWeather() {
        $.ajax({
            url: "https://api.openweathermap.org/data/2.5/weather?lat=36.3504&lon=127.3845&appid=79298ba965842ed428a7110241d823a6&units=metric",
            method: "GET",
            success: function(response) {
                var temperature = response.main.temp;
                var humidity = response.main.humidity;

                $('#temperature').text(Math.round(temperature) + '°C');
                $('#humidity').text(humidity + '%');
            },
            error: function() {
                console.error("날씨 데이터를 가져오는 데 실패했습니다.");
            }
        });
    }

    $(document).ready(function() {
        updateWeather();

        setInterval(updateWeather, 30000);
    });
</script>
</body>
</html>
