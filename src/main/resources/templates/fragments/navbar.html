<div id="header" th:fragment="navbar">
    <div class="home">
        <a href="/">
            <img src="/images/icon-home.svg" alt="홈">
            홈
        </a>
    </div>

    <div class="user">
        <!-- user 또는 admin이 없을 경우 -->
        <th:block th:if="${session.user == null and session.admin == null}">
            <a href="/signup">회원가입</a>
            <a href="/login">로그인</a>
        </th:block>

        <!-- user 또는 admin이 있을 경우 -->
        <th:block th:if="${session.user != null or session.admin != null}">
            <h3>환영합니다, <br>
                <span th:if="${session.user != null}" th:text="${session.user.name}"></span>
                <span th:if="${session.admin != null}" th:text="${session.admin.name}"></span>
                님!</h3>
            <a href="/mypage">마이페이지</a>
            <a href="/logout">로그아웃</a>
        </th:block>
    </div>
</div>
