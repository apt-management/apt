<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="sub">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div id="container">
            <div class="sub-title">
                <p>마이페이지</p>
            </div>
            <div class="wrap my-page">
                <div>
                    <p class="title">회원정보 관리</p>
                    <ul>
                        <li>
                            <a href="/mypage/modify_info">
                                <div class="my-page-circle">
                                    <img src="/images/icon-info-change.svg" alt="회원정보 수정">
                                </div>
                                <span>회원정보 수정</span>
                            </a>
                        </li>
                        <li>
                            <a href="/mypage/withdrawal">
                                <div class="my-page-circle">
                                    <img src="/images/icon-info-delete.svg" alt="회원 탈퇴">
                                </div>                            
                                <span>회원 탈퇴</span>
                            </a>
                        </li>
                        <li>
                            <a href="/mypage/notify">
                                <div class="my-page-circle">
                                    <img src="/images/icon-user-bell.svg" alt="알림 설정">
                                </div>
                                <span>알림 설정</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <div>
                    <p class="title">택배 관리</p>
                    <ul>
                        <li>
                            <a href="/mypage/new_parcel">
                                <div class="my-page-circle">
                                    <p th:text="${totalDelivery}"></p>
                                </div>
                                <span>신규 택배</span>
                            </a>
                        </li>
                        <li>                            
                            <a href="/mypage/deliver">
                                <div class="my-page-circle">
                                    <p>1</p>
                                </div>                                
                                <span>배송 중</span>
                            </a>
                        </li>
                        <li>
                            <a href="/mypage/deliver_completed">
                                <div class="my-page-circle">
                                    <p>1</p>
                                </div>
                                <span>배송 완료</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
