<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 상세 페이지</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
<div id="sub">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div id="container">
        <div class="sub-title">
            <p>공지사항</p>
        </div>
        <div class="wrap">
            <div class="board-inner">
                <div class="board-title">
                    <!-- 제목 동적 바인딩 -->
                    <p th:text="${notice.title}">공지사항 제목</p>
                    <div>
                        <img src="/images/icon-view.svg" alt="조회수">
                        <span th:text="${notice.viewer}">0</span>
                    </div>
                </div>
                <div class="board-content">
                    <!-- 내용 동적 바인딩 -->
                    <p th:text="${notice.content}">공지사항 내용</p>
                </div>
                <div class="board-file" th:if="${notice.attach}">
                    <div>
                        <p>첨부파일</p>
                    </div>
                    <div class="file-wrap">
                        <ul>
                            <li>
                                <p th:text="${notice.attach}">첨부파일명</p>
                                <a th:href="@{${notice.attach}}" download>다운로드</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="board-navigation">
                <!-- 이전 글 버튼 -->
                <a th:href="@{/notice/view/{id}(id=${prevId})}" th:if="${prevId != null}" class="board-prev">
                    <img src="/images/icon-arrow-left.svg" alt="이전 글">
                    이전 글
                </a>
                <a href="/notice"><button type="button">목록</button></a>
                <!-- 다음 글 버튼 -->
                <a th:href="@{/notice/view/{id}(id=${nextId})}" th:if="${nextId != null}" class="board-next">
                    다음 글
                    <img src="/images/icon-arrow-right.svg" alt="다음 글">
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
