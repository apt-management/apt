<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="sub">

        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div id="container">
            <div class="sub-title">
                <p>비밀번호 재설정</p>
            </div>
            <div class="wrap">
                <div class="form re-password-form">
                    <p class="title">비밀번호 재설정</p>
                    <form action="">
                        <ul class="form-list">
                            <li>
                                <label for="userid">아이디</label>
                                <input type="text" id="userid" name="userid">
                            </li>
                            <li>
                                <label for="number">전화번호</label>
                                <input type="text" id="number" name="number" placeholder="-를 제외하고 입력">
                            </li>
                            <li>
                                <label for="password">새로운 비밀번호</label>
                                <input type="password" id="password" name="password" placeholder="영문, 숫자, 특수 문자 포함 8~12자">
                            </li>
                        </ul>
                        <div class="btn-box type-02">
                            <button type="button">취소</button>
                            <button type="button">비밀번호 재설정</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>

    </script>
</body>
</html>
