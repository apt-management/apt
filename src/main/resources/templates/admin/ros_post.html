<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS Post</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/roslib.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/battery_control.js"></script>
    <style>
        #wrap {min-width: 1130px;}
        #robot {display: grid; place-items: center; gap: 20px; width: calc(100% - 100px); margin: 100px auto;}
        #robot > div {width: 600px; border: 1px solid #484848; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, .1); padding: 20px 25px;}
        #robot button {display: grid; place-items: center; width: 100%; font-weight: 500; color: #FFF; background: #484848; border-radius: 8px; transition: background .3s; padding: 15px 0;}
        #robot button:hover {background: #696969;}
        input[type="checkbox"] {display: block; width: 20px; aspect-ratio: 1; background: url(/images/icon-checkbox-off.svg) center/contain no-repeat;}
        input[type="checkbox"]:checked {background-image: url(/images/icon-checkbox-on.svg);}
        .robot_title {font-size: 24px; font-weight: 500;}

        .delivery_state {display: grid; place-items: center; height: 80px; background: #484848;}
        #delivery {font-size: 32px; font-weight: 500; color: #FFF;}
        .place-check {display: flex; gap: 30px; flex-direction: column;}
        .place-check ul {display: flex; gap: 20px; align-items: center;}
        .place-check ul li {display: flex; gap: 10px; align-items: center;}
        .place-check ul li label {font-size: 18px;}
        .place-check .btn-box {text-align: right;}
    </style>
</head>
<body>
<div id="wrap">
    <div id="header">
        <p>택배 운송 로봇</p>
        <p id="voltageDisplay">배터리 잔량 확인 중</p>
    </div>
    <div id="robot">
        <div class="delivery_state">
            <span id="delivery">배송 전</span>
        </div>
        <div class="place-check">
            <p class="robot_title">배송지 선택</p>
            <form id="form" method="post" action="/rosPost">
                <ul>
                    <li>
                        <input type="checkbox" name="place" id="place_101" value="101">
                        <label for="place_101">101동</label>
                    </li>
                    <li>
                        <input type="checkbox" name="place" id="place_102" value="102">
                        <label for="place_102">102동</label>
                    </li>
                    <li>
                        <input type="checkbox" name="place" id="place_103" value="103">
                        <label for="place_103">103동</label>
                    </li>
                </ul>
                <div class="btn-box">
                    <!--<button type="button" onclick="robot_move()">배송 시작</button>-->
                    <button type="submit">배송 상태 변경 테스트 버튼</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    document.getElementById("form").addEventListener("submit", function(e){
        e.preventDefault()

        const selectedEls =document.querySelectorAll("input[name='place']:checked");

        selectedEls.forEach((el) => {
            console.log(el.value)
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/admin/delivery/rosPost", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.addEventListener("load", function(){
                console.log("뭔가 가기는 갔을 때 이 출력이 뜰거임")
            })

            const deliveryRequest = {
                address: el.value + "동",
                status: "배송 중"
            };

            // 상태값과 주소를 JSON 형식으로 서버로 전송
            xhr.send(JSON.stringify(deliveryRequest));
        });
    })
    // 배송 상태 업데이트 함수
    function delivery_state(state, address) {
        // 배송 중 : ing
        // 배송 완료 : complete

        // 초기 값 : 배송 전
        if (state.value == "") {
            // 01. 배송 시작 버튼 누른 후 상태 변경 (배송 중)
            state.value = "ing";  // 상태를 "ing"로 변경
            state.textContent = "배송 중";  // 버튼의 텍스트도 변경

            // 서버로 배송 상태 전송 (배송 중)
            updateDeliveryStatus(address, "ing");
        } else if (state.value == "ing") {
            // 02. 상태 변경 (배송 완료)
            state.value = "complete";  // 상태를 "complete"로 변경
            state.textContent = "배송 완료";  // 버튼의 텍스트도 변경

            // 서버로 배송 상태 전송 (배송 완료)
            updateDeliveryStatus(address, "complete");
        }
    }

    // 배송 상태 업데이트 함수 (웹페이지 표시)
    function updateDeliveryState(status) {
        const deliveryElement = document.getElementById("delivery");
        deliveryElement.textContent = status; // 배송 상태 변경
    }

    // 서버로 배송 상태를 전송하는 함수 (AJAX)
    function updateDeliveryStatus(address, status) {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/rosPost", true);
        xhr.setRequestHeader("Content-Type", "application/json");

        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                console.log("배송 상태가 성공적으로 업데이트되었습니다.");
            } else if (xhr.readyState == 4 && xhr.status != 200) {
                console.log("배송 상태 업데이트에 실패했습니다. 상태 코드:", xhr.status);
            }
        };

        const deliveryRequest = {
            address: address,
            status: status
        };

        // 상태값과 주소를 JSON 형식으로 서버로 전송
        xhr.send(JSON.stringify(deliveryRequest));
    }

    // 배송 상태 변경 및 로봇 이동 시작
    function startDelivery(address) {
        // 배송지 선택된 구역 리스트 생성
        const selectedPlaces = [];
        document.querySelectorAll(".place-check li input:checked").forEach(input => {
            selectedPlaces.push(input.value); // 선택된 동을 배열에 추가
        });

        // 배송 상태를 '배송 중'으로 업데이트
        updateDeliveryState("배송 중");

        // 서버로 배송 시작 요청을 보냄 (주소를 URL에 포함)
        startDeliveryRequest(address);

        // 로봇이 이동할 구역 선택 메시지 전송 (ROS Topic을 통해)
        sendRobotMoveMessage(selectedPlaces);
    }

    // 배송 시작 요청을 서버로 전송
    function startDeliveryRequest(address) {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", `/start/${address}`, true);  // 서버 경로에 주소 포함
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                console.log(xhr.responseText);  // 성공적인 응답 처리
            }
        };
        xhr.send();
    }

    // 로봇 이동 시작 메시지 전송 (ROS)
    function sendRobotMoveMessage(selectedPlaces) {
        // ROS 연결
        const ros = new ROSLIB.Ros({
            url: 'ws://localhost:9090'  // 실제 로봇의 ROS 서버 주소로 변경 필요
        });

        // 로봇 상태 변경 Topic 설정
        const robot_state = new ROSLIB.Topic({
            ros: ros,
            name: "/robot_state",
            messageType: "std_msgs/String"
        });

        // 선택된 구역 정보를 쉼표로 구분하여 메시지로 전송
        const placeMessage = new ROSLIB.Message({
            data: selectedPlaces.join(",") // 선택된 지역 구역들
        });

        // 로봇 이동 상태를 'go'로 설정하여 배송 시작
        const moveMessage = new ROSLIB.Message({
            data: "go"
        });

        // 로봇 상태 및 배송지 정보 전송
        robot_state.publish(moveMessage);
        const robot_place = new ROSLIB.Topic({
            ros: ros,
            name: "/robot_place",
            messageType: "std_msgs/String"
        });
        robot_place.publish(placeMessage);
    }
</script>
