<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS Post</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/roslib.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/battery_control_02.js"></script>
    <style>
        #wrap {min-width: 1130px;}
        #robot {display: grid; place-items: center; gap: 20px; width: calc(100% - 100px); margin: 100px auto;}
        #robot > div {width: 600px; border: 1px solid #484848; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, .1); padding: 20px 25px;}
        #robot button {display: grid; place-items: center; width: 100%; font-weight: 500; color: #FFF; background: #484848; border-radius: 8px; transition: background .3s; padding: 15px 0;}
        #robot button:hover {background: #696969;}
        input[type="checkbox"] {display: block; width: 20px; aspect-ratio: 1; background: url(/images/icon-checkbox-off.svg) center/contain no-repeat;}
        input[type="checkbox"]:checked {background-image: url(/images/icon-checkbox-on.svg);}
        .robot_title {font-size: 24px; font-weight: 500;}

        .delivery_state {display: grid; place-items: center; height: 80px; background: #484848;}
        #delivery {font-size: 32px; font-weight: 500; color: #FFF;}
        .place-check {display: flex; gap: 30px; flex-direction: column;}
        .place-check ul {display: flex; gap: 20px; align-items: center; margin-bottom: 30px;}
        .place-check ul li {display: flex; gap: 10px; align-items: center;}
        .place-check ul li label {font-size: 18px;}
        .place-check .btn-box {text-align: right;}
    </style>
</head>
<body>
<div id="wrap">
    <div id="header">
        <p>택배 운송 로봇</p>
        <p id="voltageDisplay">배터리 잔량 확인 중</p>
    </div>
    <div id="robot">
        <div class="delivery_state">
            <span id="delivery">배송 전</span>
        </div>
        <div class="place-check">
            <p class="robot_title">배송지 선택</p>
            <form id="form" method="post" action="/rosPost">
                <!-- 등록된 배송지가 없을 때 -->
                <p th:if="${#lists.isEmpty(deliveries)}">등록된 배송지가 없습니다.</p>

                <!-- 등록된 택배 중 배송 상태가 배송 전인 구역 불러오기 -->
                <ul>
                    <li th:each="deliveries : ${deliveries}">
                        <input type="checkbox" name="place" th:value="${deliveries.address}" th:id="${deliveries.address}"/>
                        <label th:for="${deliveries.address}" th:text="${deliveries.address}"></label>
                    </li>
                </ul>

                <div class="btn-box">
                    <button type="submit" onclick="robot_move()">배송 시작</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    document.getElementById("form").addEventListener("submit", function(e){
        e.preventDefault();

        const selectedEls = document.querySelectorAll("input[name='place']:checked");

        selectedEls.forEach((el) => {
            console.log(el.value);
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/admin/delivery/rosPost", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            const deliveryRequest = {
                address: el.value,
                status: "배송 중"
            };

            xhr.send(JSON.stringify(deliveryRequest));

            el.style.display = "none";
            const label = el.nextElementSibling;
            if (label) {
                label.style.display = "none";
            }
        });
    });
</script>


<script>
    // ROS 연결
    const ros = new ROSLIB.Ros({
        url: ROSCAR_WS_URL_02
    });

    // 로봇 상태 변경을 위한 ROS Topic
    const robot_state = new ROSLIB.Topic({
        ros: ros,
        name: "/robot_state",
        messageType: "std_msgs/String"
    });

    // 배송지 구역 정보를 전달할 ROS Topic
    const robot_place = new ROSLIB.Topic({
        ros: ros,
        name: "/robot_place",
        messageType: "std_msgs/String"
    });

    // 배송 상태 업데이트 함수
    const delivery_state = new ROSLIB.Topic({
        ros: ros,
        name: "/delivery_status",
        messageType: "std_msgs/String"
    });

    // 배송 상태 구독
    delivery_state.subscribe(function(message) {
        let deliveryText = "배송 중";
        let recentPlaces = message.data.split(","); // 배송지 정보 추출
        let lastPlace = recentPlaces[recentPlaces.length - 1].trim(); // 마지막 배송지

        if (lastPlace !== "배송 완료") {
            deliveryText += " / 최근 배송지 : " + lastPlace;
        } else {
            // 배송 완료
            deliveryText = "배송 완료"; // 배송 완료 상태

            // 서버에 배송 완료 상태를 전달하여 데이터베이스 업데이트
            fetch("/delivery/rosPost", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    deliveryId: "deliveryId",
                    newStatus: "배송 완료"  // 상태 변경
                })
            })
                .then(response => response.json())
                .then(data => {
                    console.log("배송 완료 상태 업데이트됨", data);
                })
                .catch(error => console.error("Error:", error));

            alert("배송이 완료되었습니다!");
            document.getElementById("form").reset();
        }

        document.getElementById("delivery").innerText = deliveryText;
    });

    // 로봇 이동 함수 (배송 시작)
    function robot_move() {
        var selectedPlaces = [];

        // 선택된 구역 확인
        document.querySelectorAll(".place-check li input:checked").forEach(input => {
            selectedPlaces.push(input.value); // 선택된 동을 배열에 추가
        });

        // 로봇 상태를 'go'로 설정하여 배송 시작
        const moveMessage = new ROSLIB.Message({
            data: "go"
        });

        // 로봇 상태를 '배송 중'으로 업데이트
        document.getElementById("delivery").innerText = "배송 중";

        // 선택된 구역 정보를 쉼표로 구분하여 메시지로 전송
        const placeMessage = new ROSLIB.Message({
            data: selectedPlaces.join(",")
        });

        // 로봇 상태 및 배송지 정보 전송
        robot_state.publish(moveMessage);
        robot_place.publish(placeMessage);
    }

    // 배터리 상태 모니터링 코드 (예시로 추가 가능)
    // 배터리 상태를 실시간으로 표시하려면 이 코드에서 로봇 배터리 상태 메시지를 받아와서 화면에 출력
    const battery_state = new ROSLIB.Topic({
        ros: ros,
        name: "/battery_status",
        messageType: "std_msgs/String"
    });

    battery_state.subscribe(function(message) {
        document.getElementById("voltageDisplay").innerText = "배터리 잔량: " + message.data; // 배터리 상태 업데이트
    });
</script>
</body>
</html>
