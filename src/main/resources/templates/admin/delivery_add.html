<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신규 택배 추가</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="wrap">

    <div th:replace="~{fragments/admin_headerbar :: admin_headerbar}"></div>

    <div id="container">

        <div th:replace="~{fragments/admin_navbar :: admin_navbar}"></div>

        <div id="content" class="board">
            <div class="navigation">
                <p>HOME</p>
                <p>></p>
                <p>택배 관리</p>
                <p>></p>
                <p>신규 택배</p>
            </div>
            <div class="board-inner">
                <strong class="board-title">신규 택배</strong>
                <form action="/admin/delivery/add" method="POST">
                    <div class="board-input write">
                        <table>
                            <colgroup>
                                <col style="width: 20%">
                                <col>
                            </colgroup>
                            <tbody>

                            <tr>
                                <td>이름</td>
                                <td>
                                    <input type="text" name="name" id="name" required>
                                </td>
                            </tr>

                            <tr>
                                <td>전화번호</td>
                                <td>
                                    <input type="text" name="number" id="number" required>
                                </td>
                            </tr>

                            <tr>
                                <td>거주 구역</td>
                                <td>
                                    <input type="text" name="address" id="address" required>
                                </td>
                            </tr>

                            <tr>
                                <td>운송장 번호</td>
                                <td>
                                    <input type="text" name="trackingNumber" id="trackingNumber" required>
                                </td>
                            </tr>

                            <tr>
                                <td>배송 상태</td>
                                <td>
                                    <input type="text" name="status" id="status" value="배송 전" required readonly>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="btn-wrap btn-wrap-big">
                        <button type="button" class="btn" onclick="history.back()">취소</button>
                        <button type="submit" class="btn">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
