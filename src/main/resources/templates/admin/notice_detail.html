<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 상세 페이지</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div id="wrap">

    <div th:replace="~{fragments/admin_headerbar :: admin_headerbar}"></div>

    <div id="container">

        <div th:replace="~{fragments/admin_navbar :: admin_navbar}"></div>

        <div id="content" class="board">
            <div class="navigation">
                <p>HOME</p>
                <p>></p>
                <p>공지사항</p>
            </div>
            <div class="board-inner">
                <strong class="board-title">공지사항</strong>
                <form th:action="@{/admin/notice/edit/{id}(id=${notice.id})}" method="POST">
                    <div class="board-input write">
                        <table>
                            <colgroup>
                                <col style="width: 20%">
                                <col>
                            </colgroup>
                            <tbody>
                            <tr>
                                <td>제목</td>
                                <td>
                                    <input type="text" name="title" th:value="${notice.title}">
                                </td>
                            </tr>
                            <tr>
                                <td>작성일</td>
                                <td th:text="${notice.createDate}">2025-02-05</td>
                            </tr>
                            <tr>
                                <td>첨부파일</td>
                                <td>
                                    <div class="file-wrap">
                                        <p th:text="${fileName}">운영방침 안내.jpg</p>
                                        <div class="btn-wrap btn-wrap-small">
                                            <a th:href="@{/uploads/{fileName}(fileName=${fileName})}" class="btn">다운로드</a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>내용</td>
                                <td>
                                    <textarea name="content" th:text="${notice.content}">아파트 운영방침을 안내해드립니다.</textarea>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="btn-wrap btn-wrap-big">
                        <button type="submit" class="btn">저장</button>
                        <a th:href="@{/admin/notice/delete/{id}(id=${notice.id})}">
                            <button type="button" class="btn">삭제</button>
                        </a>
                        <a href="/admin/notice" class="btn">목록</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
